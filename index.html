<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="boat.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OddsseyApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js"></script>
</head>

<body class="bg-gradient-to-r from-teal-400 to-yellow-200">
    <nav></nav>
        <div id="home">
            <div>
                <div>
                    <h1 class="text-7xl font-bold text-gray-800 mb-6 text-center">OdysseyApp</h1>
                    <p class= "text-7x1 font-bold text-gray-800 mb-6 text-center italic"> ...the Odyssey builder... </p>
                </div>
                <div class="mt-20">
                    <div class="flex-1 h-full">
                        <form class="space-y-6 w-full mx-auto" id="myForm">
                            <div class="flex mx-48 mb-20">
                                <div class="flex-2 mx-auto">
                                    <!-- <label for="start" class="block text-sm font-medium text-gray-700 mb-2">
                                        Where do you want to start your journey?
                                    </label> -->
                                    <input 
                                        type="text" 
                                        id="start"
                                        placeholder="Start location"
                                        class="w-full mx-auto px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 outline-none"
                                    >
                                </div>
                                <div class="flex-2 mx-auto">
                                    <!-- <label for="end" class="block text-sm font-medium text-gray-700 mb-2">
                                        Where do you want to end your journey?
                                    </label> -->
                                    <input type="text"
                                    id="end"
                                    placeholder="End location"
                                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 outline-none">
                
                                </div>
                            </div>
                            <div class="w-1/4 mx-auto flex flex-center">
                                <button
                                    type="submit"
                                    class=" mx-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                                    onClick="playStory()"
                                >
                                    Let's start the journey!
                                </button>
                            </div>
                        </form>
                    </div>
                </form>
                </div>
            </div>
        </div>

        <!-- Main modal -->
        <div id="default-modal" tabindex="-1" aria-hidden="true" class="hidden overflow-y-auto overflow-x-hidden fixed z-50 justify-center items-center w-full md:inset-0 h-full border">
            <div class="relative top-16 p-4 w-full max-w-2xl mx-auto">
                <!-- Modal content -->
                    <div class="relative bg-white border rounded-md shadow-sm p-4 md:p-6">
                    <!-- Modal header -->
                    <div class="flex items-center justify-between border-b border-default pb-4 md:pb-5">
                        <h3 class="text-lg font-medium text-heading">
                            Your story
                        </h3>
                        <button type="button" onClick="hidePopup()" class="text-body bg-transparent hover:bg-neutral-tertiary hover:text-heading rounded-base text-sm w-9 h-9 ms-auto inline-flex justify-center items-center" onClick>
                            <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18 17.94 6M18 18 6.06 6"/></svg>
                            <span class="sr-only">Close modal</span>
                        </button>
                    </div>
                    <!-- Modal body -->
                    <div class="space-y-4 md:space-y-6 py-4 md:py-6">
                        <p 
                            class=" font-medium text-gray-700 mb-2 text-center"
                            id = "aiResponse"
                            > ... waiting for ai response ...
                        </p>
                    </div>
                    <!-- Modal footer -->
                    <div class="flex items-center border-t space-x-4 pt-4 md:pt-5">
                        <button 
                            data-modal-hide="default-modal" 
                            onClick="hidePopup()" 
                            type="button" 
                            class="bg-brand box-border border hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none content-center"
                            >New story
                        </button>

                        <button 
                            id = "continue"
                            type="submit" 
                            class="bg-brand box-border border hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none content center"
                            hidden
                            >Continue
                        </button>
                        <audio id="aiAudio" controls></audio>
                    </div>

                </div>
            </div>
        </div>
    </body>
</html>
