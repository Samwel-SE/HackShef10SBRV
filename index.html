<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OddsseyApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js"></script>
</head>

<body class="bg-slate-400">
    <div>
        <div>
            <h1 class="text-7xl font-bold text-gray-800 mb-6 text-center">Odyessy App</h1>
            <form class="space-y-6 w-1/3 ml-5" id="myForm">
                <!-- First Input Field -->
                <div>
                    <label for="text" class="block text-sm font-medium text-gray-700 mb-2">
                        Where do you want to start ?
                    </label>
                    <input 
                        name ="startCityInput"
                        type="text" 
                        id="start"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 outline-none"
                    >
                </div>

                <!-- Second Input Field -->
                <div>
                    <label for="text" class="block text-sm font-medium text-gray-700 mb-2">
                        What time do you want to go to ?
                    </label>
                    <input 
                        name = "timeInput"
                        id="end"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 outline-none"
                    >
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                    onClick="getFormInput()"
                >
                    Let's start the journey!
                </button>
            </form>
        </div>
    </div>

    <p>{{ message }}</p>
</body>
</html>
