<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="boat.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OddsseyApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js"></script>
</head>

<body class="bg-gradient-to-r from-teal-400 to-yellow-200">
    <div>
        <div>
            <div>
                <img class = "mx-auto object-center" src = boatbg.png alt = "boat"  width = "300" height = "300">
                <p class= "text-7x1 font-bold text-gray-800 mb-6 text-center italic"> ...the Odyssey builder... </p> 
            </div>
            <div class="mt-20">
                <div class="flex-1 h-full">
                    <form class="space-y-6 w-full mx-auto" id="myForm">
                        <div class="flex mx-48 mb-20">
                            <div class="flex-2 mx-auto">
                                <!-- <label for="start" class="block text-sm font-medium text-gray-700 mb-2">
                                    Where do you want to start your journey?
                                </label> -->
                                <input 
                                    type="text" 
                                    id="start"
                                    placeholder="Start location"
                                    class="w-full mx-auto px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 outline-none"
                                >
                            </div>
                            <div class="flex-2 mx-auto">
                                <!-- <label for="end" class="block text-sm font-medium text-gray-700 mb-2">
                                    Where do you want to end your journey?
                                </label> -->
                                <input type="text"
                                id="end"
                                placeholder="End location"
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 outline-none">
            
                            </div>
                        </div>
                        <div class="w-1/4 mx-auto flex flex-center">
                            <button 
                                type="submit"
                                class="mx-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                                onClick="playStory()"
                            >
                                Let's start the journey!
                            </button>
                        </div>
                    </form>
                </div>
            </form>
            
            <audio id="aiAudio" controls></audio>

            </div>

            <p class=" font-medium text-gray-700 mb-2 text-center"
               id = "aiResponse"
               > ... waiting for ai response ...
            </p>
                
            <!--- Continue Button --->
            <div class="w-1/4 mx-auto flex flex-center">
            <button display = "block" 
             id="continue" 
             type="submit" 
             hidden
             class=" flex2 mx-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors duration-200 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
             >
                Continue
            </button>
            </div>
            
        </div>
    </div>
</body>
</html>
